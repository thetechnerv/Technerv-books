<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b0c">
<title>Offline · Tech Nerv Accounts</title>
<style>
  :root { color-scheme: light dark; --bg:#f2f4f5; --cell:#fff; --label:#0c1113; --label2:rgba(23,34,37,.62); --accent:#03ddaa; --on:#032920; }
  @media (prefers-color-scheme: dark) { :root { --bg:#070b0c; --cell:#111a1c; --label:#f5f8f9; --label2:rgba(222,236,239,.64); } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:24px;
         background:var(--bg); color:var(--label); font:17px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif;
         -webkit-font-smoothing:antialiased; text-align:center; }
  .card { max-width:340px; }
  .logo { width:64px; height:64px; border-radius:16px; background:var(--accent); display:flex; align-items:center; justify-content:center; margin:0 auto 20px; box-shadow:0 10px 24px rgba(3,221,170,.35); }
  h1 { font-size:24px; letter-spacing:-.02em; margin:0 0 6px; }
  p { color:var(--label2); font-size:15px; margin:0 0 24px; }
  button { appearance:none; border:0; border-radius:14px; height:50px; padding:0 28px; background:var(--accent); color:var(--on); font:600 17px/1 inherit; font-family:inherit; }
  button:active { transform:scale(.97); }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg width="38" height="34" viewBox="0 0 652 576" aria-hidden="true"><g transform="translate(0 576) scale(0.1 -0.1)" fill="#0C1113"><path d="M680 5228 c0 -2 -1 -360 -3 -795 -2 -653 0 -794 11 -798 50 -19 302 14 447 58 269 83 477 210 691 422 98 97 229 281 269 375 10 25 24 52 30 60 6 8 24 49 39 90 16 41 34 91 42 110 31 82 84 428 71 463 -6 16 -70 17 -802 17 -437 0 -795 -1 -795 -2z M3615 5209 c-234 -39 -443 -122 -645 -255 -143 -94 -315 -265 -418 -416 -40 -59 -72 -109 -72 -112 0 -3 -13 -27 -28 -53 -61 -103 -121 -273 -155 -433 l-22 -105 0 -1695 0 -1695 42 -3 c23 -2 97 4 164 13 202 26 324 64 519 162 327 164 595 449 734 778 21 50 42 98 47 107 10 20 20 59 57 213 l26 110 3 880 c2 484 5 890 8 903 l5 22 790 0 790 0 5 23 c9 35 1 1551 -8 1565 -6 9 -191 12 -870 11 -789 -1 -871 -3 -972 -20z"/></g></svg>
    </div>
    <h1>You’re offline</h1>
    <p>Your books live securely online, so this screen needs a connection. Nothing you saved has been lost.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
  <script>addEventListener('online', () => location.reload());</script>
</body>
</html>
